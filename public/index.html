<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morning Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap">
<style>
:root{--bg:#111413;--panel:#181c1a;--line:#262c29;--text:#f4f7f4;--body:#aab4ad;--mute:#7d8982;--acc:#6ee7a0;--inset:#111413}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f6f4;--panel:#fff;--line:#dfe6e1;--text:#111815;--body:#46514b;--mute:#6a766f;--acc:#12804a;--inset:#eef3f0}}
:root[data-theme="light"]{--bg:#f3f6f4;--panel:#fff;--line:#dfe6e1;--text:#111815;--body:#46514b;--mute:#6a766f;--acc:#12804a;--inset:#eef3f0}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--body);font:15px/1.5 Inter,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--text);text-decoration:none}a:hover{color:var(--acc)}
main{max-width:1200px;margin:0 auto;padding:28px 20px 60px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.head small{color:var(--mute)}
h1{margin:2px 0 0;font-size:clamp(1.9rem,5vw,2.6rem);color:var(--text);letter-spacing:-.03em;cursor:pointer}
.status{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.85rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.dot.bad{background:#f59e0b}
.tb{background:none;border:1px solid var(--line);color:var(--body);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:.8rem}
nav{display:flex;gap:26px;margin:24px 0 22px;border-bottom:1px solid var(--line);overflow-x:auto}
nav a{padding:0 0 12px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
nav a.on{color:var(--text);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
.span2{grid-column:span 2}
.pt{font-weight:600;color:var(--text);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.pt a{font-weight:500;font-size:.8rem;color:var(--acc)}
.it{display:block;padding:14px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0;padding-bottom:0}
.it .t{font-weight:500;line-height:1.35}
.it.lead .t{font-size:1.25rem;font-weight:600}
.it .m{margin-top:5px;font-size:.8rem;color:var(--mute)}
.it .m i{font:normal .78rem 'JetBrains Mono',monospace}
.it .s{margin-top:5px;font-size:.88rem;color:var(--body)}
.big{font-size:4rem;font-weight:700;color:var(--text);line-height:1;margin:14px 0 6px}
.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-top:16px}
.h{flex:0 0 64px;background:var(--inset);border-radius:10px;padding:10px 4px;text-align:center;font-size:.8rem}
.h b{display:block;color:var(--text);margin:3px 0}
.days{display:grid;gap:2px}
.d{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.d:last-child{border-bottom:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}
.facts div{background:var(--inset);border-radius:10px;padding:10px 12px;font-size:.8rem}
.facts b{display:block;color:var(--text);font-size:1.05rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
input{flex:1;min-width:140px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--inset);color:var(--text);font:inherit}
.empty{color:var(--mute);padding:10px 0}
.skel{height:14px;border-radius:6px;background:var(--line);margin:18px 0;animation:p 1.2s infinite alternate}
@keyframes p{to{opacity:.4}}
@media(max-width:820px){.grid{grid-template-columns:1fr}.span2{grid-column:auto}main{padding:20px 14px 50px}.big{font-size:3.2rem}}
</style>
</head>
<body>
<main>
<div class="head">
  <div><small id="date"></small><h1 id="greet"></h1></div>
  <div class="status"><span class="dot" id="dot"></span><span id="upd">Loading…</span><button class="tb" id="theme">Theme</button></div>
</div>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<script>
var $=function(s){return document.querySelector(s)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var TABS=[["home","Today"],["news","News"],["weather","Weather"],["gaming","Gaming"],["industry","Industry"]];
var TITLES={news:"Top headlines",gaming:"Gaming",industry:"Industry & newsletters"};
var cache={},failed=false,lastUpdate=null;

function ago(iso){if(!iso)return"";var s=(Date.now()-new Date(iso))/1000;
  if(s<90)return"just now";if(s<3600)return Math.round(s/60)+"m ago";if(s<86400)return Math.round(s/3600)+"h ago";return Math.round(s/86400)+"d ago"}
function stamp(){lastUpdate=new Date();$("#upd").textContent="Updated "+lastUpdate.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});$("#dot").className="dot"+(failed?" bad":"")}

async function feed(sec,force){
  var c=cache[sec];if(c&&!force&&Date.now()-c.t<300000)return c.d;
  var r=await fetch("/api/feed?section="+sec);if(!r.ok)throw new Error("feed "+r.status);
  var d=await r.json();cache[sec]={t:Date.now(),d:d};return d}

function item(i,lead,summary){
  var a=el("a","it"+(lead?" lead":""));a.href=i.link;a.target="_blank";a.rel="noopener noreferrer";
  a.appendChild(el("div","t",i.title));
  var m=el("div","m");m.appendChild(document.createTextNode(i.source+" · "));m.appendChild(el("i","",ago(i.date)));a.appendChild(m);
  if(summary&&i.summary)a.appendChild(el("div","s",i.summary));return a}

function panel(title,link,cls){var p=el("section","panel "+(cls||""));var h=el("div","pt");h.appendChild(el("span","",title));
  if(link){var a=el("a","","See all");a.href="#"+link;h.appendChild(a)}p.appendChild(h);return p}
function skel(p,n){for(var i=0;i<n;i++)p.appendChild(el("div","skel"))}

async function fillList(p,sec,n,full,lead){
  skel(p,n>3?4:3);
  try{var d=await feed(sec);while(p.children.length>1)p.removeChild(p.lastChild);
    if(d.failed&&d.failed.length)failed=true;
    var items=d.items.slice(0,n);if(!items.length)p.appendChild(el("div","empty","No items right now."));
    items.forEach(function(i,k){p.appendChild(item(i,lead&&k===0,full))});stamp();
    if(full&&d.failed&&d.failed.length)p.appendChild(el("div","empty","Couldn’t reach: "+d.failed.join(", ")))
  }catch(e){while(p.children.length>1)p.removeChild(p.lastChild);failed=true;p.appendChild(el("div","empty","Couldn’t load this section. It will retry automatically."))}}

/* ---------- weather ---------- */
var WC={0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Snow showers",95:"Thunderstorm",96:"Thunderstorm, hail",99:"Thunderstorm, hail"};
var wxCache=null;
function getPos(){return new Promise(function(res,rej){if(!navigator.geolocation)return rej();navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lon:p.coords.longitude})},rej,{timeout:9000,maximumAge:600000})})}
async function locName(l){try{var r=await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+l.lat+"&longitude="+l.lon+"&localityLanguage=en");var j=await r.json();return j.city||j.locality||j.principalSubdivision||"Your location"}catch(e){return"Your location"}}
async function getLoc(force){
  var saved=null;try{saved=JSON.parse(ls("mb-loc")||"null")}catch(e){}
  if(saved&&saved.manual&&!force)return saved;
  if(saved&&!force&&Date.now()-saved.t<1800000)return saved;
  try{var p=await getPos();var l={lat:p.lat,lon:p.lon,name:await locName(p),t:Date.now()};ls("mb-loc",JSON.stringify(l));return l}
  catch(e){if(saved)return saved;return null}}
async function getWx(l){
  if(wxCache&&wxCache.k===l.lat+","+l.lon&&Date.now()-wxCache.t<600000)return wxCache.d;
  var u="https://api.open-meteo.com/v1/forecast?latitude="+l.lat+"&longitude="+l.lon+"&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,precipitation&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&wind_speed_unit=mph&timezone=auto&forecast_days=7";
  var r=await fetch(u);if(!r.ok)throw new Error("wx");var d=await r.json();wxCache={k:l.lat+","+l.lon,t:Date.now(),d:d};return d}
function hrs(d,n){var i=d.hourly.time.findIndex(function(t){return t>=d.current.time.slice(0,13)});if(i<0)i=0;var w=el("div","hours");
  for(var k=i;k<i+n&&k<d.hourly.time.length;k++){var h=el("div","h");h.appendChild(el("span","",k===i?"Now":d.hourly.time[k].slice(11,13)+":00"));h.appendChild(el("b","",Math.round(d.hourly.temperature_2m[k])+"°"));h.appendChild(el("span","",(d.hourly.precipitation_probability[k]||0)+"%"));w.appendChild(h)}return w}
async function fillWx(p,l,full){
  skel(p,3);
  try{var d=await getWx(l);while(p.children.length>1)p.removeChild(p.lastChild);var c=d.current,dy=d.daily;
    p.children[0].firstChild.textContent="Weather · "+l.name;
    p.appendChild(el("div","big",Math.round(c.temperature_2m)+"°"));
    p.appendChild(el("div","",(WC[c.weather_code]||"")+" · "+Math.round(dy.temperature_2m_max[0])+"° / "+Math.round(dy.temperature_2m_min[0])+"°"));
    p.appendChild(hrs(d,full?24:5));
    if(full){var f=el("div","facts");[["Feels like",Math.round(c.apparent_temperature)+"°"],["Humidity",c.relative_humidity_2m+"%"],["Wind",Math.round(c.wind_speed_10m)+" mph"],["Rain today",dy.precipitation_probability_max[0]+"%"],["Sunrise",dy.sunrise[0].slice(11)],["Sunset",dy.sunset[0].slice(11)]].forEach(function(x){var b=el("div");b.appendChild(document.createTextNode(x[0]));b.appendChild(el("b","",x[1]));f.appendChild(b)});p.appendChild(f)}
    stamp()
  }catch(e){while(p.children.length>1)p.removeChild(p.lastChild);failed=true;p.appendChild(el("div","empty","Couldn’t load the weather."))}}
function noLoc(p,rerender){while(p.children.length>1)p.removeChild(p.lastChild);
  p.appendChild(el("div","empty","Location is off. Allow it in your browser, or search for a place."));
  var r=el("div","row"),i=el("input");i.placeholder="Town or city";i.setAttribute("aria-label","Town or city");var b=el("button","tb","Use place");
  var go=async function(){var q=i.value.trim();if(!q)return;try{var j=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name="+encodeURIComponent(q))).json();
    var g=j.results&&j.results[0];if(!g){i.value="";i.placeholder="Not found, try again";return}
    ls("mb-loc",JSON.stringify({lat:g.latitude,lon:g.longitude,name:g.name,manual:true,t:Date.now()}));rerender()}catch(e){}};
  b.onclick=go;i.onkeydown=function(e){if(e.key==="Enter")go()};r.append(i,b);p.appendChild(r);
  var u=el("button","tb","Try my location again");u.style.marginTop="10px";u.onclick=function(){ls("mb-loc","null");rerender()};p.appendChild(u)}

/* ---------- views ---------- */
async function weatherInto(p,full,rerender){var l=await getLoc(false);if(!l)return noLoc(p,rerender);fillWx(p,l,full)}
function home(v){
  var g=el("div","grid");
  var n=panel("Top headlines","news","span2"),w=panel("Weather","weather"),ga=panel("Gaming","gaming"),ind=panel("Industry & newsletters","industry","span2");
  g.append(n,w,ga,ind);v.appendChild(g);
  fillList(n,"news",4,false,true);weatherInto(w,false,function(){render()});fillList(ga,"gaming",4,false);fillList(ind,"industry",4,false)}
function listView(v,sec){var p=panel(TITLES[sec]);v.appendChild(p);fillList(p,sec,30,true,true)}
function weatherView(v){
  var g=el("div","grid");var p=panel("Weather","", "span2");g.appendChild(p);
  var s=panel("Next 7 days");g.appendChild(s);v.appendChild(g);
  weatherInto(p,true,function(){render()});
  getLoc(false).then(function(l){if(!l){s.appendChild(el("div","empty","Set a location to see the forecast."));return}
    getWx(l).then(function(d){var days=el("div","days"),dy=d.daily;
      dy.time.forEach(function(t,i){var r=el("div","d");r.appendChild(el("b","",i===0?"Today":new Date(t+"T12:00").toLocaleDateString([], {weekday:"short"})));
        r.appendChild(el("span","",(WC[dy.weather_code[i]]||"")+" · "+dy.precipitation_probability_max[i]+"% rain"));
        r.appendChild(el("span","",Math.round(dy.temperature_2m_max[i])+"° / "+Math.round(dy.temperature_2m_min[i])+"°"));days.appendChild(r)});s.appendChild(days)}).catch(function(){s.appendChild(el("div","empty","Couldn’t load the forecast."))})})}

function render(){
  var h=(location.hash||"#home").slice(1);if(!TABS.some(function(t){return t[0]===h}))h="home";failed=false;
  var nav=$("#nav");nav.innerHTML="";TABS.forEach(function(t){var a=el("a",t[0]===h?"on":"",t[1]);a.href="#"+t[0];nav.appendChild(a)});
  var v=$("#view");v.innerHTML="";
  if(h==="home")home(v);else if(h==="weather")weatherView(v);else listView(v,h)}
function greet(){var n=new Date(),hr=n.getHours();$("#greet").textContent=hr<12?"Good morning":hr<18?"Good afternoon":"Good evening";
  $("#date").textContent=n.toLocaleDateString([], {weekday:"long",day:"numeric",month:"long"})}
$("#greet").onclick=function(){location.hash="#home"};
$("#theme").onclick=function(){var cur=document.documentElement.getAttribute("data-theme");
  var dark=cur?cur==="dark":!matchMedia("(prefers-color-scheme:light)").matches;var nx=dark?"light":"dark";document.documentElement.setAttribute("data-theme",nx);ls("mb-theme",nx)};
var th=ls("mb-theme");if(th)document.documentElement.setAttribute("data-theme",th);
window.addEventListener("hashchange",render);
greet();render();
setInterval(function(){cache={};wxCache=null;greet();render()},600000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&lastUpdate&&Date.now()-lastUpdate>600000){cache={};wxCache=null;greet();render()}});
</script>
</body>
</html>
